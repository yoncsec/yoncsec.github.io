name: Hexo Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install

      - name: Sync posts from Obsidian vault
        run: |
          git clone --depth 1 https://github.com/yoncsec/blog-posts.git /tmp/blog-posts
          rm -rf source/_posts
          mkdir -p source/_posts
          cp /tmp/blog-posts/*.md source/_posts/ 2>/dev/null || true
          echo "=== Posts ===" && ls source/_posts/

      - run: npx hexo generate

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: main
          force_orphan: true
